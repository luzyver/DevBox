services:
  devbox-app:
    container_name: devbox-app
    build: .
    ports:
      - "25:25"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    environment:
      - SMTP_PORT=25
      - HTTP_PORT=8080
      - REDIS_URL=redis://devbox-redis:6379/0
      - HMAC_SECRET=${HMAC_SECRET}
      - SERVER_IP=${SERVER_IP}
      - INBOX_TTL=${INBOX_TTL}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET}
      - GOOGLE_BASE_EMAIL=${GOOGLE_BASE_EMAIL}
      - GOOGLE_IMAP_USER=${GOOGLE_IMAP_USER}
      - GOOGLE_IMAP_APP_PASSWORD=${GOOGLE_IMAP_APP_PASSWORD}
      - GOOGLE_IMAP_HOST=${GOOGLE_IMAP_HOST}
      - GOOGLE_IMAP_POLL_INTERVAL=${GOOGLE_IMAP_POLL_INTERVAL}
    depends_on:
      devbox-redis:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  devbox-redis:
    container_name: devbox-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
